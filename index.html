<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGqr · generator modern</title>
  <!-- qrcode library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #f8faff 0%, #f0f3fd 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 1rem;
    }

    .card {
      max-width: 1100px;
      width: 100%;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 30px 60px rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.5);
    }

    h1 {
      font-weight: 600;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      color: #0b1741;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 1.5rem;
    }
    h1 span {
      background: #1b2b6e;
      color: white;
      font-size: 0.9rem;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      margin-left: 0.75rem;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 2rem;
      align-items: start;
    }

    .control-panel {
      background: white;
      border-radius: 2rem;
      padding: 1.8rem 1.5rem;
      box-shadow: 0 15px 30px rgba(0,10,30,0.05);
      border: 1px solid rgba(0,0,0,0.02);
    }

    .input-group {
      margin-bottom: 2rem;
    }
    label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #52658f;
      display: block;
      margin-bottom: 0.5rem;
    }
    .url-field {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: #f2f5fc;
      border-radius: 2rem;
      padding: 0.2rem 0.2rem 0.2rem 1.5rem;
      border: 1px solid #e2eafc;
    }
    .url-field:focus-within {
      border-color: #3b4e9e;
      box-shadow: 0 0 0 4px rgba(48, 86, 255, 0.1);
    }
    .url-field input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 1rem 0;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      color: #121f3f;
    }
    .url-field button {
      background: #1c2b5e;
      border: none;
      color: white;
      font-weight: 500;
      padding: 0.8rem 1.8rem;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.15s;
      white-space: nowrap;
      border: 1px solid #ffffff30;
    }
    .url-field button:hover {
      background: #233779;
      transform: scale(1.02);
    }

    .error-message {
      color: #d43b3b;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      font-weight: 500;
      padding-left: 1rem;
      min-height: 1.8rem;
    }

    .color-row {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .color-item {
      flex: 1 1 160px;
    }
    .color-item span {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #2d3d6b;
      margin-bottom: 0.3rem;
    }
    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      background: #f2f5fc;
      padding: 0.4rem 0.9rem 0.4rem 0.4rem;
      border-radius: 40px;
    }
    input[type="color"] {
      width: 40px;
      height: 40px;
      border: 2px solid white;
      border-radius: 40px;
      cursor: pointer;
      background: none;
      padding: 0;
    }
    .color-hex {
      font-family: monospace;
      font-size: 0.95rem;
      color: #121f3f;
    }

    .logo-section {
      margin: 2rem 0 1.5rem;
    }
    .logo-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .upload-btn {
      background: #e9eefe;
      color: #1b2b6e;
      font-weight: 500;
      padding: 0.7rem 1.4rem;
      border-radius: 40px;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px dashed #7289c4;
      transition: 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .upload-btn:hover {
      background: #dde4fe;
    }
    .logo-size {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.2rem;
    }
    .logo-size label {
      margin-bottom: 0;
      text-transform: none;
      font-weight: 500;
      color: #1b2b6e;
    }
    input[type=range] {
      flex: 1;
      height: 6px;
      background: #dbe1f0;
      border-radius: 10px;
      -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: #1c2b5e;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .action-row {
      display: flex;
      gap: 0.8rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }
    .btn {
      background: white;
      border: 1px solid #c9d4ec;
      color: #1b2b6e;
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }
    .btn-primary {
      background: #1b2b6e;
      border-color: #1b2b6e;
      color: white;
      box-shadow: 0 8px 18px rgba(20, 40, 100, 0.25);
    }
    .btn-primary:hover {
      background: #233e8a;
      transform: translateY(-2px);
    }

    .preview-panel {
      background: white;
      border-radius: 2rem;
      padding: 1.8rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0,0,0,0.02);
    }
    .preview-title {
      font-weight: 500;
      color: #7789b4;
      margin-bottom: 1.2rem;
      font-size: 0.9rem;
      align-self: flex-start;
    }
    .qr-wrapper {
      background: #fbfdff;
      padding: 1.2rem;
      border-radius: 2rem;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
      margin: 0.5rem 0 1rem;
      display: flex;
      justify-content: center;
      width: 100%;
      min-height: 280px;
      align-items: center;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    #qrcode img {
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      display: block;
    }
    .logo-hint {
      font-size: 0.85rem;
      color: #6173a3;
      background: #f0f5ff;
      border-radius: 30px;
      padding: 0.4rem 1.2rem;
      margin: 0.2rem 0;
    }
    .footer-note {
      margin-top: 2rem;
      text-align: center;
      color: #92a2c1;
      font-size: 0.85rem;
    }

    @media (max-width: 700px) {
      .grid-container {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .card { padding: 1.5rem; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>CGqr <span>real‑time + logo</span></h1>

  <div class="grid-container">
    <div class="control-panel">
      <div class="input-group">
        <label>🔗 URL / teks</label>
        <div class="url-field">
          <input type="url" id="urlInput" placeholder="https://contoh.com" value="https://example.com">
          <button id="generateBtn">Generate</button>
        </div>
        <div id="urlError" class="error-message"></div>
      </div>

      <div class="color-row">
        <div class="color-item">
          <span>QR warna</span>
          <div class="color-picker-wrap">
            <input type="color" id="fgColor" value="#000000">
            <span class="color-hex" id="fgHex">#000000</span>
          </div>
        </div>
        <div class="color-item">
          <span>Background</span>
          <div class="color-picker-wrap">
            <input type="color" id="bgColor" value="#ffffff">
            <span class="color-hex" id="bgHex">#ffffff</span>
          </div>
        </div>
      </div>

      <div class="logo-section">
        <div class="logo-header">
          <span style="font-weight: 600; color:#1b2b6e;">🖼️ Logo tengah</span>
          <label for="logoUpload" class="upload-btn">
            <span>📁 pilih gambar</span>
          </label>
          <input type="file" id="logoUpload" accept="image/*" style="display: none;">
        </div>
        <div class="logo-size" id="logoSizeControl" style="display: none;">
          <label>ukuran logo</label>
          <input type="range" id="logoSizeSlider" min="10" max="35" value="20" step="1">
          <span id="logoSizeValue">20%</span>
        </div>
        <div class="logo-hint" id="logoHint">belum ada logo</div>
      </div>

      <div class="action-row">
        <button class="btn" id="downloadBtn">⬇️ Download PNG</button>
        <button class="btn" id="resetBtn">↺ Reset</button>
      </div>
      <p style="font-size:0.8rem; color:#90a0c5; margin-top:1.5rem;">* logo tidak mengganggu scan (error correction H)</p>
    </div>

    <div class="preview-panel">
      <div class="preview-title">👀 live preview</div>
      <div class="qr-wrapper" id="qrWrapper">
        <div id="qrcode"></div>
      </div>
      <span id="previewStatus" style="font-size:0.9rem; color:#3f5283;">QR akan muncul di sini</span>
    </div>
  </div>
  <div class="footer-note">⚡ semua di client — realtime + logo</div>
</div>

<script>
  (function() {
    // DOM elements
    const urlInput = document.getElementById('urlInput');
    const generateBtn = document.getElementById('generateBtn');
    const urlError = document.getElementById('urlError');
    const fgColor = document.getElementById('fgColor');
    const bgColor = document.getElementById('bgColor');
    const fgHex = document.getElementById('fgHex');
    const bgHex = document.getElementById('bgHex');
    const logoUpload = document.getElementById('logoUpload');
    const logoHint = document.getElementById('logoHint');
    const logoSizeControl = document.getElementById('logoSizeControl');
    const logoSizeSlider = document.getElementById('logoSizeSlider');
    const logoSizeValue = document.getElementById('logoSizeValue');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const qrcodeDiv = document.getElementById('qrcode');
    const previewStatus = document.getElementById('previewStatus');

    // state
    let currentLogo = null;
    let logoScale = 0.2; // 20% default

    // update hex labels
    fgColor.addEventListener('input', () => {
      fgHex.textContent = fgColor.value;
      generateQR();
    });
    
    bgColor.addEventListener('input', () => {
      bgHex.textContent = bgColor.value;
      generateQR();
    });

    // validasi URL
    function isValidUrl(str) {
      if (!str || str.trim() === '') return false;
      try {
        new URL(str);
        return true;
      } catch {
        return false;
      }
    }

    // fungsi untuk menggabungkan QR dengan logo
    function mergeQRWithLogo(qrImage, logoImg) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        
        // Gambar QR
        ctx.drawImage(qrImage, 0, 0, 256, 256);
        
        // Gambar logo di tengah
        const maxSize = 256 * logoScale;
        let w = logoImg.naturalWidth;
        let h = logoImg.naturalHeight;
        const ratio = Math.min(maxSize / w, maxSize / h);
        w = w * ratio;
        h = h * ratio;
        const x = (256 - w) / 2;
        const y = (256 - h) / 2;
        
        ctx.drawImage(logoImg, x, y, w, h);
        
        // Buat image baru dari canvas
        const mergedImage = new Image();
        mergedImage.onload = () => resolve(mergedImage);
        mergedImage.src = canvas.toDataURL('image/png');
      });
    }

    // fungsi untuk generate QR
    async function generateQR() {
      const url = urlInput.value.trim();
      
      if (!url) {
        urlError.textContent = '⚠️ masukkan URL';
        qrcodeDiv.innerHTML = '';
        previewStatus.textContent = 'masukkan URL untuk generate';
        return;
      }
      
      if (!isValidUrl(url)) {
        urlError.textContent = '❌ URL tidak valid';
        qrcodeDiv.innerHTML = '';
        previewStatus.textContent = 'URL tidak valid';
        return;
      }
      
      urlError.textContent = '';
      
      // Clear previous QR
      qrcodeDiv.innerHTML = '';
      
      try {
        // Buat QR baru
        new QRCode(qrcodeDiv, {
          text: url,
          width: 256,
          height: 256,
          colorDark: fgColor.value,
          colorLight: bgColor.value,
          correctLevel: QRCode.CorrectLevel.H
        });

        // Tunggu sebentar sampai QR ter-generate
        setTimeout(async () => {
          const qrImage = qrcodeDiv.querySelector('img');
          if (!qrImage) return;

          // Jika ada logo, gabungkan
          if (currentLogo) {
            const mergedImage = await mergeQRWithLogo(qrImage, currentLogo);
            // Ganti gambar QR dengan yang sudah ada logo
            qrImage.src = mergedImage.src;
          }
          
          previewStatus.textContent = '✅ QR siap';
        }, 100);
        
      } catch (err) {
        console.error('QR Error:', err);
        urlError.textContent = 'Gagal membuat QR';
      }
    }

    // event listeners
    urlInput.addEventListener('input', generateQR);
    
    generateBtn.addEventListener('click', (e) => {
      e.preventDefault();
      generateQR();
    });

    // logo upload
    logoUpload.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) {
        console.log('Tidak ada file dipilih');
        return;
      }

      console.log('File dipilih:', file.name);

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          console.log('Gambar berhasil dimuat:', img.naturalWidth, 'x', img.naturalHeight);
          currentLogo = img;
          logoHint.innerHTML = `✅ logo: ${file.name.substring(0,15)}${file.name.length>15?'…':''}`;
          logoSizeControl.style.display = 'flex';
          
          // Generate ulang QR dengan logo
          generateQR();
        };
        img.onerror = (err) => {
          console.error('Gagal memuat gambar:', err);
          alert('Gagal memuat gambar. Coba file lain.');
        };
        img.src = e.target.result;
      };
      reader.onerror = (err) => {
        console.error('FileReader error:', err);
      };
      reader.readAsDataURL(file);
    });

    // slider ukuran logo
    logoSizeSlider.addEventListener('input', function() {
      logoScale = this.value / 100;
      logoSizeValue.textContent = this.value + '%';
      if (currentLogo) {
        generateQR();
      }
    });

    // download button
    downloadBtn.addEventListener('click', function() {
      const qrImage = qrcodeDiv.querySelector('img');
      if (!qrImage || !qrImage.src) {
        alert('Belum ada QR untuk di-download');
        return;
      }
      
      const link = document.createElement('a');
      link.href = qrImage.src;
      link.download = `CGqr-${Date.now()}.png`;
      link.click();
    });

    // reset button
    resetBtn.addEventListener('click', function() {
      urlInput.value = 'https://example.com';
      fgColor.value = '#000000';
      bgColor.value = '#ffffff';
      fgHex.textContent = '#000000';
      bgHex.textContent = '#ffffff';
      
      currentLogo = null;
      logoUpload.value = '';
      logoHint.innerHTML = 'belum ada logo';
      logoSizeControl.style.display = 'none';
      logoSizeSlider.value = 20;
      logoScale = 0.2;
      logoSizeValue.textContent = '20%';
      
      generateQR();
    });

    // inisialisasi
    generateQR();
  })();
</script>
</body>
</html>
