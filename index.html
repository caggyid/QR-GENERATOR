<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>CGqr · futuristik</title>
  <!-- qrcode library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --neon-blue: #00b4ff;
      --neon-purple: #b400ff;
      --neon-pink: #ff00b4;
      --neon-green: #00ffb4;
      --dark-bg: #0a0c10;
      --darker-bg: #0a0c10;
      --card-bg: rgba(18, 22, 30, 0.8);
      --text-primary: #ffffff;
      --text-secondary: #8a9bb5;
      --text-muted: #4a5a72;
      --error-red: #ff4d6d;
      --success-green: #00ff00;
    }

    body {
      background: var(--dark-bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      padding: 0.75rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background - dioptimalkan untuk mobile */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 50%, rgba(0, 180, 255, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 70% 50%, rgba(180, 0, 255, 0.1) 0%, transparent 50%);
      animation: rotate 30s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .card {
      max-width: 1200px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 2rem;
      padding: 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8),
                  0 0 0 1px rgba(255, 255, 255, 0.05),
                  0 0 30px rgba(0, 180, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.03);
      position: relative;
      z-index: 1;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .card {
        padding: 1.5rem;
        border-radius: 2.5rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .card {
        padding: 2.5rem;
        border-radius: 3rem;
      }
    }

    /* Neon border effect - dioptimalkan */
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: inherit;
      padding: 2px;
      background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-green));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.3;
      animation: borderGlow 4s linear infinite;
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff, #a0b0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* Tablet */
    @media (min-width: 640px) {
      h1 {
        font-size: 2.2rem;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      h1 {
        font-size: 2.8rem;
        margin-bottom: 2rem;
      }
    }

    h1 span {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      color: white;
      font-size: 0.7rem;
      padding: 0.2rem 0.8rem;
      border-radius: 60px;
      -webkit-text-fill-color: white;
      font-weight: 500;
      letter-spacing: 0.02em;
      box-shadow: 0 0 15px rgba(0, 180, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      white-space: nowrap;
    }

    /* Tablet */
    @media (min-width: 640px) {
      h1 span {
        font-size: 0.9rem;
        padding: 0.3rem 1.2rem;
      }
    }

    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .grid-container {
        display: grid;
        grid-template-columns: 1.2fr 0.9fr;
        gap: 2rem;
      }
    }

    /* Control panel */
    .control-panel {
      background: rgba(12, 16, 24, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 1.5rem;
      padding: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4),
                  inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    /* Tablet */
    @media (min-width: 640px) {
      .control-panel {
        padding: 1.5rem;
        border-radius: 2rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .control-panel {
        padding: 2rem;
        border-radius: 2.5rem;
      }
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .input-group {
        margin-bottom: 2rem;
      }
    }

    label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 0.5rem;
    }

    /* Tablet */
    @media (min-width: 640px) {
      label {
        font-size: 0.8rem;
        margin-bottom: 0.6rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      label {
        font-size: 0.85rem;
        margin-bottom: 0.8rem;
      }
    }

    .url-field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 1.2rem;
      padding: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    /* Tablet */
    @media (min-width: 480px) {
      .url-field {
        flex-direction: row;
        align-items: center;
        padding: 0.3rem 0.3rem 0.3rem 1.5rem;
        border-radius: 3rem;
      }
    }

    .url-field:focus-within {
      border-color: var(--neon-blue);
      box-shadow: 0 0 0 3px rgba(0, 180, 255, 0.2);
    }

    .url-field input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.8rem 0.5rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      color: white;
      font-weight: 400;
      width: 100%;
    }

    /* Tablet */
    @media (min-width: 480px) {
      .url-field input {
        padding: 1rem 0;
        font-size: 1rem;
      }
    }

    .url-field input::placeholder {
      color: var(--text-muted);
    }

    .url-field button {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.8rem 1rem;
      border-radius: 1.2rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 5px 15px rgba(0, 180, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      width: 100%;
    }

    /* Tablet */
    @media (min-width: 480px) {
      .url-field button {
        padding: 0.8rem 1.5rem;
        border-radius: 3rem;
        font-size: 0.9rem;
        width: auto;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .url-field button {
        padding: 0.9rem 2rem;
        font-size: 0.95rem;
      }
    }

    .url-field button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 180, 255, 0.5);
    }

    .error-message {
      color: var(--error-red);
      font-size: 0.75rem;
      margin-top: 0.5rem;
      font-weight: 500;
      padding-left: 0.8rem;
      min-height: 1.5rem;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.3);
    }

    /* Tablet */
    @media (min-width: 640px) {
      .error-message {
        font-size: 0.85rem;
        padding-left: 1.2rem;
        min-height: 1.8rem;
      }
    }

    /* Color pickers */
    .color-row {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .color-row {
        gap: 1.2rem;
        margin-bottom: 2rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .color-row {
        gap: 1.5rem;
        margin-bottom: 2.2rem;
      }
    }

    .color-item {
      flex: 1 1 calc(50% - 0.4rem);
      min-width: 120px;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .color-item {
        flex: 1 1 160px;
      }
    }

    .color-item span {
      display: block;
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .color-item span {
        font-size: 0.75rem;
        margin-bottom: 0.4rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .color-item span {
        font-size: 0.8rem;
        margin-bottom: 0.5rem;
      }
    }

    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.25rem 0.5rem 0.25rem 0.25rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Tablet */
    @media (min-width: 640px) {
      .color-picker-wrap {
        gap: 0.7rem;
        padding: 0.4rem 0.9rem 0.4rem 0.4rem;
      }
    }

    input[type="color"] {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      cursor: pointer;
      background: none;
      padding: 0;
      flex-shrink: 0;
    }

    /* Tablet */
    @media (min-width: 640px) {
      input[type="color"] {
        width: 38px;
        height: 38px;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      input[type="color"] {
        width: 42px;
        height: 42px;
      }
    }

    .color-hex {
      font-family: 'Inter', monospace;
      font-size: 0.7rem;
      color: #a0b0ff;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .color-hex {
        font-size: 0.85rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .color-hex {
        font-size: 0.95rem;
      }
    }

    /* Logo section */
    .logo-section {
      margin: 1.5rem 0 1.2rem;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .logo-section {
        margin: 2rem 0 1.5rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .logo-section {
        margin: 2.2rem 0 1.8rem;
      }
    }

    .logo-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .logo-header span {
      font-weight: 600;
      color: white;
      font-size: 0.9rem;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .logo-header span {
        font-size: 1rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .logo-header span {
        font-size: 1.1rem;
      }
    }

    .upload-btn {
      background: rgba(255, 255, 255, 0.03);
      color: white;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    /* Tablet */
    @media (min-width: 640px) {
      .upload-btn {
        padding: 0.7rem 1.4rem;
        font-size: 0.9rem;
        gap: 0.6rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .upload-btn {
        padding: 0.8rem 1.6rem;
        font-size: 0.95rem;
      }
    }

    .logo-size {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-top: 1rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.8rem 1rem;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      flex-wrap: wrap;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .logo-size {
        gap: 1rem;
        padding: 1rem 1.5rem;
        flex-wrap: nowrap;
      }
    }

    .logo-size label {
      margin-bottom: 0;
      color: #a0b0ff;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .logo-size label {
        font-size: 0.85rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .logo-size label {
        font-size: 0.9rem;
      }
    }

    input[type=range] {
      flex: 1;
      height: 6px;
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
      border-radius: 10px;
      -webkit-appearance: none;
      min-width: 120px;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--neon-blue);
      box-shadow: 0 0 15px var(--neon-blue);
    }

    /* Tablet */
    @media (min-width: 640px) {
      input[type=range]::-webkit-slider-thumb {
        width: 20px;
        height: 20px;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      input[type=range]::-webkit-slider-thumb {
        width: 22px;
        height: 22px;
      }
    }

    #logoSizeValue {
      color: var(--neon-blue);
      font-weight: 600;
      min-width: 40px;
      font-size: 0.8rem;
    }

    /* Tablet */
    @media (min-width: 640px) {
      #logoSizeValue {
        font-size: 0.9rem;
        min-width: 45px;
      }
    }

    .logo-hint {
      font-size: 0.75rem;
      color: #6d7f9f;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 30px;
      padding: 0.4rem 1rem;
      margin: 0.5rem 0 0;
      border: 1px solid rgba(255, 255, 255, 0.03);
      display: inline-block;
      width: auto;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .logo-hint {
        font-size: 0.85rem;
        padding: 0.5rem 1.5rem;
      }
    }

    /* Action buttons */
    .action-row {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .action-row {
        gap: 1rem;
        margin-top: 2rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .action-row {
        margin-top: 2.5rem;
      }
    }

    .btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: white;
      padding: 0.7rem 1.2rem;
      border-radius: 50px;
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(5px);
      flex: 1 1 auto;
      justify-content: center;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .btn {
        padding: 0.8rem 1.5rem;
        font-size: 0.9rem;
        gap: 0.6rem;
        flex: 0 1 auto;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .btn {
        padding: 0.9rem 1.8rem;
        font-size: 0.95rem;
      }
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      border: none;
      box-shadow: 0 5px 20px rgba(0, 180, 255, 0.4);
    }

    /* Preview panel */
    .preview-panel {
      background: rgba(12, 16, 24, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 1.5rem;
      padding: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4),
                  inset 0 1px 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .preview-panel {
        padding: 1.5rem;
        border-radius: 2rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .preview-panel {
        padding: 2rem;
        border-radius: 2.5rem;
      }
    }

    .preview-title {
      font-weight: 500;
      color: #a0b0ff;
      margin-bottom: 1rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .preview-title {
        font-size: 0.85rem;
        margin-bottom: 1.2rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .preview-title {
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }
    }

    .qr-wrapper {
      background: rgba(0, 0, 0, 0.3);
      padding: 1rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                  inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      margin: 0.5rem 0 1rem;
      display: flex;
      justify-content: center;
      width: 100%;
      min-height: 220px;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }

    /* Tablet */
    @media (min-width: 640px) {
      .qr-wrapper {
        padding: 1.2rem;
        border-radius: 2rem;
        min-height: 260px;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .qr-wrapper {
        min-height: 300px;
      }
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    #qrcode img {
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      display: block;
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.3);
      width: 180px;
      height: 180px;
      object-fit: contain;
    }

    /* Tablet */
    @media (min-width: 640px) {
      #qrcode img {
        width: 220px;
        height: 220px;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      #qrcode img {
        width: 256px;
        height: 256px;
      }
    }

    #previewStatus {
      font-size: 0.75rem;
      color: #6d7f9f;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Tablet */
    @media (min-width: 640px) {
      #previewStatus {
        font-size: 0.85rem;
        margin-top: 0.8rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      #previewStatus {
        font-size: 0.95rem;
        margin-top: 1rem;
      }
    }

    .footer-note {
      margin-top: 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.7rem;
      letter-spacing: 0.02em;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      padding-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    /* Tablet */
    @media (min-width: 640px) {
      .footer-note {
        margin-top: 2rem;
        font-size: 0.8rem;
        padding-top: 2rem;
        gap: 0.5rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .footer-note {
        margin-top: 2.5rem;
        font-size: 0.9rem;
      }
    }

    .footer-note i {
      color: var(--neon-pink);
    }

    /* Touch optimization untuk mobile */
    @media (max-width: 480px) {
      button, 
      .upload-btn,
      .btn,
      input[type="range"] {
        min-height: 44px;
        min-width: 44px;
      }
      
      input[type="color"] {
        width: 44px;
        height: 44px;
      }
      
      .url-field input {
        font-size: 16px; /* Mencegah zoom on focus di iOS */
      }
    }

    /* Landscape mode optimization */
    @media (max-height: 600px) and (orientation: landscape) {
      .grid-container {
        gap: 0.8rem;
      }
      
      .qr-wrapper {
        min-height: 150px;
      }
      
      #qrcode img {
        width: 120px;
        height: 120px;
      }
      
      .footer-note {
        margin-top: 0.8rem;
        padding-top: 0.8rem;
      }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>
    CGqr <i class="fa-solid fa-qrcode" style="background: linear-gradient(135deg, #00b4ff, #b400ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
    <span>NEON</span>
  </h1>

  <div class="grid-container">
    <div class="control-panel">
      <div class="input-group">
        <label><i class="fa-solid fa-link" style="margin-right: 0.5rem; color: #00b4ff;"></i> URL / TEKS</label>
        <div class="url-field">
          <input type="url" id="urlInput" placeholder="https://example.com" value="https://example.com">
          <button id="generateBtn"><i class="fa-solid fa-bolt"></i> GENERATE</button>
        </div>
        <div id="urlError" class="error-message"></div>
      </div>

      <div class="color-row">
        <div class="color-item">
          <span><i class="fa-solid fa-palette" style="margin-right: 0.3rem;"></i> QR WARNA</span>
          <div class="color-picker-wrap">
            <input type="color" id="fgColor" value="#00b4ff">
            <span class="color-hex" id="fgHex">#00b4ff</span>
          </div>
        </div>
        <div class="color-item">
          <span><i class="fa-solid fa-fill-drip" style="margin-right: 0.3rem;"></i> BACKGROUND</span>
          <div class="color-picker-wrap">
            <input type="color" id="bgColor" value="#0a0c10">
            <span class="color-hex" id="bgHex">#0a0c10</span>
          </div>
        </div>
      </div>

      <div class="logo-section">
        <div class="logo-header">
          <span><i class="fa-solid fa-cloud-upload-alt" style="color: #b400ff; margin-right: 0.5rem;"></i> Logo Tengah</span>
          <label for="logoUpload" class="upload-btn">
            <i class="fa-solid fa-image"></i> Pilih
          </label>
          <input type="file" id="logoUpload" accept="image/*" style="display: none;">
        </div>
        <div class="logo-size" id="logoSizeControl" style="display: none;">
          <label><i class="fa-solid fa-sliders"></i> Ukuran</label>
          <input type="range" id="logoSizeSlider" min="10" max="35" value="20" step="1">
          <span id="logoSizeValue">20%</span>
        </div>
        <div class="logo-hint" id="logoHint">
          <i class="fa-regular fa-circle"></i> belum ada logo
        </div>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" id="downloadBtn"><i class="fa-solid fa-download"></i> Download</button>
        <button class="btn" id="resetBtn"><i class="fa-solid fa-undo-alt"></i> Reset</button>
      </div>
      <p style="font-size:0.7rem; color:#4a5a72; margin-top:1rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
        <i class="fa-solid fa-shield" style="color: #00b4ff;"></i> Error correction H · Logo aman 100%
      </p>
    </div>

    <div class="preview-panel">
      <div class="preview-title">
        <i class="fa-solid fa-eye" style="color: #b400ff;"></i> LIVE PREVIEW
        <i class="fa-solid fa-circle" style="color: #00ff00; font-size: 0.4rem; margin-left: 0.3rem; animation: glowPulse 1s infinite;"></i>
      </div>
      <div class="qr-wrapper" id="qrWrapper">
        <div id="qrcode"></div>
      </div>
      <span id="previewStatus"><i class="fa-solid fa-spinner fa-pulse"></i> siap generate...</span>
    </div>
  </div>
  
  <div class="footer-note">
    <i class="fa-solid fa-crown" style="color: #ffd700;"></i> CGqr · 100% CLIENT SIDE 
    <i class="fa-solid fa-bolt" style="color: #00b4ff;"></i>
  </div>
</div>

<script>
  (function() {
    // DOM elements
    const urlInput = document.getElementById('urlInput');
    const generateBtn = document.getElementById('generateBtn');
    const urlError = document.getElementById('urlError');
    const fgColor = document.getElementById('fgColor');
    const bgColor = document.getElementById('bgColor');
    const fgHex = document.getElementById('fgHex');
    const bgHex = document.getElementById('bgHex');
    const logoUpload = document.getElementById('logoUpload');
    const logoHint = document.getElementById('logoHint');
    const logoSizeControl = document.getElementById('logoSizeControl');
    const logoSizeSlider = document.getElementById('logoSizeSlider');
    const logoSizeValue = document.getElementById('logoSizeValue');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const qrcodeDiv = document.getElementById('qrcode');
    const previewStatus = document.getElementById('previewStatus');

    // state
    let currentLogo = null;
    let logoScale = 0.2;

    // update hex labels
    fgColor.addEventListener('input', () => {
      fgHex.textContent = fgColor.value;
      generateQR();
    });
    
    bgColor.addEventListener('input', () => {
      bgHex.textContent = bgColor.value;
      generateQR();
    });

    function isValidUrl(str) {
      if (!str || str.trim() === '') return false;
      try {
        new URL(str);
        return true;
      } catch {
        return false;
      }
    }

    function mergeQRWithLogo(qrImage, logoImg) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(qrImage, 0, 0, 256, 256);
        
        const maxSize = 256 * logoScale;
        let w = logoImg.naturalWidth;
        let h = logoImg.naturalHeight;
        const ratio = Math.min(maxSize / w, maxSize / h);
        w = w * ratio;
        h = h * ratio;
        const x = (256 - w) / 2;
        const y = (256 - h) / 2;
        
        ctx.drawImage(logoImg, x, y, w, h);
        
        const mergedImage = new Image();
        mergedImage.onload = () => resolve(mergedImage);
        mergedImage.src = canvas.toDataURL('image/png');
      });
    }

    async function generateQR() {
      const url = urlInput.value.trim();
      
      if (!url) {
        urlError.textContent = '⚠️ MASUKKAN URL';
        qrcodeDiv.innerHTML = '';
        previewStatus.innerHTML = '<i class="fa-solid fa-exclamation-triangle" style="color: #ff4d6d;"></i> masukkan URL';
        return;
      }
      
      if (!isValidUrl(url)) {
        urlError.textContent = '❌ URL TIDAK VALID';
        qrcodeDiv.innerHTML = '';
        previewStatus.innerHTML = '<i class="fa-solid fa-times-circle" style="color: #ff4d6d;"></i> URL tidak valid';
        return;
      }
      
      urlError.textContent = '';
      qrcodeDiv.innerHTML = '';
      previewStatus.innerHTML = '<i class="fa-solid fa-spinner fa-pulse"></i> generating...';
      
      try {
        new QRCode(qrcodeDiv, {
          text: url,
          width: 256,
          height: 256,
          colorDark: fgColor.value,
          colorLight: bgColor.value,
          correctLevel: QRCode.CorrectLevel.H
        });

        setTimeout(async () => {
          const qrImage = qrcodeDiv.querySelector('img');
          if (!qrImage) return;

          if (currentLogo) {
            const mergedImage = await mergeQRWithLogo(qrImage, currentLogo);
            qrImage.src = mergedImage.src;
          }
          
          previewStatus.innerHTML = '<i class="fa-solid fa-check-circle" style="color: #00ff00;"></i> QR SIAP';
        }, 100);
        
      } catch (err) {
        console.error('QR Error:', err);
        urlError.textContent = 'GAGAL MEMBUAT QR';
        previewStatus.innerHTML = '<i class="fa-solid fa-exclamation-circle" style="color: #ff4d6d;"></i> error';
      }
    }

    urlInput.addEventListener('input', generateQR);
    
    generateBtn.addEventListener('click', (e) => {
      e.preventDefault();
      generateQR();
    });

    logoUpload.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentLogo = img;
          logoHint.innerHTML = `<i class="fa-solid fa-check-circle" style="color: #00ff00;"></i> logo: ${file.name.substring(0,12)}${file.name.length>12?'…':''}`;
          logoSizeControl.style.display = 'flex';
          generateQR();
        };
        img.onerror = () => {
          alert('GAGAL MEMUAT GAMBAR');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    logoSizeSlider.addEventListener('input', function() {
      logoScale = this.value / 100;
      logoSizeValue.textContent = this.value + '%';
      if (currentLogo) generateQR();
    });

    downloadBtn.addEventListener('click', function() {
      const qrImage = qrcodeDiv.querySelector('img');
      if (!qrImage || !qrImage.src) {
        alert('BELUM ADA QR CODE');
        return;
      }
      
      const link = document.createElement('a');
      link.href = qrImage.src;
      link.download = `CGqr-${Date.now()}.png`;
      link.click();
    });

    resetBtn.addEventListener('click', function() {
      urlInput.value = 'https://example.com';
      fgColor.value = '#00b4ff';
      bgColor.value = '#0a0c10';
      fgHex.textContent = '#00b4ff';
      bgHex.textContent = '#0a0c10';
      
      currentLogo = null;
      logoUpload.value = '';
      logoHint.innerHTML = '<i class="fa-regular fa-circle"></i> belum ada logo';
      logoSizeControl.style.display = 'none';
      logoSizeSlider.value = 20;
      logoScale = 0.2;
      logoSizeValue.textContent = '20%';
      
      generateQR();
    });

    generateQR();
  })();
</script>
</body>
</html>
